<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
    * {
        box-sizing: border-box;
    }

    html {
        min-height: 100%;
        background: #101413;
        display: grid;
        place-items: center;
        padding: 28px 16px;
    }

    body {
        width: min(100%, 540px);
        margin: 0;
        padding: 38px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        background: #1a201d;
        color: #edf1e9;
        border: 1px solid #354037;
        border-top: 4px solid #d6fa63;
        border-radius: 18px;
        box-shadow: 0 24px 70px #00000055;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    body::before {
        content: "NUMBER VAULT / 001";
        grid-column: 1 / -1;
        color: #d6fa63;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
    }

    #title {
        grid-column: 1 / -1;
        margin: 6px 0 14px;
        font-size: clamp(25px, 5vw, 36px);
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -1px;
    }

    label[for="secretNum"] {
        grid-column: 1 / -1;
        color: #a7b1a4;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    #secretNum {
        width: 100%;
        min-width: 0;
        padding: 16px;
        background: #111612;
        color: #edf1e9;
        border: 1px solid #414c3e;
        border-radius: 8px;
        font: inherit;
        font-size: 18px;
        color-scheme: dark;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    #secretNum::placeholder {
        color: #7e897b;
        font-size: 14px;
    }

    #secretNum:focus {
        outline: none;
        border-color: #d6fa63;
        box-shadow: 0 0 0 3px #d6fa631c;
    }

    #button {
        padding: 0 22px;
        background: #d6fa63;
        color: #17200d;
        border: none;
        border-radius: 8px;
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 1px;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
    }

    #button:hover {
        background: #e5ff97;
        transform: translateY(-2px);
    }

    #button:active {
        transform: translateY(0);
    }

    #button:focus-visible {
        outline: 2px solid #edf1e9;
        outline-offset: 4px;
    }

    #numbercount {
        grid-column: 1 / -1;
        margin-top: 12px;
        padding: 24px 0;
        border-top: 1px solid #354037;
        border-bottom: 1px solid #354037;
        color: #d6fa63;
        font-size: 42px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
    }

    #numbercount::before {
        content: "COUNTDOWN";
        display: block;
        margin-bottom: 10px;
        color: #a7b1a4;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 3px;
    }

    #history {
        grid-column: 1 / -1;
        min-height: 72px;
        padding: 16px;
        background: #111612;
        border-radius: 8px;
        color: #edf1e9;
        font-family: Consolas, monospace;
        font-size: 16px;
        line-height: 1.8;
        word-spacing: 10px;
        overflow-wrap: anywhere;
    }

    #history::before {
        content: "GUESS HISTORY";
        display: block;
        margin-bottom: 6px;
        color: #899582;
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 10px;
        letter-spacing: 2px;
        word-spacing: normal;
    }

    #guesscount {
        grid-column: 1 / -1;
        color: #a7b1a4;
        font-size: 12px;
        letter-spacing: 1px;
    }

    br {
        display: none;
    }

    @media (max-width: 420px) {
        body {
            padding: 26px 20px;
        }

        #button {
            padding: 0 14px;
        }
    }
</style>
</head>
<body>
    <P id="title">Input your S E C R E T number</P>
    <!-- Flow Player one sets number, player two guesses -->
        <label for="secretNum"> Set Secret Number </label>
        <input type="number"
               name="secret"
               id="secretNum"
               placeholder="Enter a Number"> 
        <input type="button" 
               name="SetValue" 
               id="button"
               value="LOCK IN →"
               onclick="setSecretNumber()"
               >
               <script src="GuessingGame.js"></script>
        <span id="numbercount">10</span>
        <div id="history"></div>
        <div id="guesscount">Guesses: 0</div>
</body>
</html>

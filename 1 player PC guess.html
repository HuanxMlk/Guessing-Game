<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Search Game</title>
    <style>
    * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    html {
        min-height: 100%;
        background: linear-gradient(135deg, #0f172a, #1e293b);
    }

    body {
        width: calc(100% - 32px);
        max-width: 380px;
        margin: 40px auto;
        padding: 32px;
        color: #f8fafc;
        text-align: center;
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(12px);
    }

    p {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.6;
    }

    #guess {
        display: block;
        margin: 12px 0;
        color: #38bdf8;
        font-size: 80px;
        font-weight: 800;
        line-height: 1.2;
        text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    #range, #count {
        color: #f8fafc;
        font-weight: 600;
    }

    button {
        display: block;
        width: 100%;
        margin: 10px 0;
        padding: 14px;
        color: #f8fafc;
        background: #334155;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, filter 0.2s;
    }

    #lower {
        background: #ef4444;
    }

    #higher {
        background: #3b82f6;
    }

    #correct {
        background: #10b981;
    }

    button:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
    }

    button:active {
        transform: translateY(0);
    }

    button:disabled {
        opacity: 0.4;
        cursor: default;
        transform: none;
        filter: none;
    }

    button:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 3px;
    }

    #history {
        color: #cbd5e1;
        text-align: left;
        line-height: 1.8;
    }
</style>
</head>
<body>
    <p>Think of a whole number from 0 to 100.</p>
    <p>Is your number <span id="guess">50</span>?</p>
    <p>Range: <span id="range">0 to 100</span></p>
    <p>Guesses: <span id="count">1</span></p>
    <button id="lower" type="button" onclick="guess(0)">Lower</button>
    <button id="higher" type="button" onclick="guess(1)">Higher</button>
    <button id="correct" type="button" onclick="guess(2)">You guessed!</button>
    <button type="button" onclick="guess(3)">Restart</button>
    <p>History:</p>
    <p id="history"></p>
    <script>
        var lowValue = 0;
        var highValue = 100;
        var currentGuess = 50;
        var guessCount = 1;
        var gameOver = false;
        function guess(answer) {
            if (answer == 3) {
                lowValue = 0;
                highValue = 100;
                currentGuess = 50;
                guessCount = 1;
                gameOver = false;
                document.getElementById("history").innerHTML = "";
                alert("Choose a number from 0 to 100.");
            } else {
                if (gameOver) {
                    return;
                }
                if (answer == 2) {
                    document.getElementById("history").innerHTML += currentGuess + " - Correct<br>";
                    lowValue = currentGuess;
                    highValue = currentGuess;
                    gameOver = true;
                    alert("Your number is " + currentGuess + "!");
                } else {
                    if (answer == 0) {
                        document.getElementById("history").innerHTML += currentGuess + " - Lower<br>";
                        highValue = currentGuess - 1;
                    } else if (answer == 1) {
                        document.getElementById("history").innerHTML += currentGuess + " - Higher<br>";
                        lowValue = currentGuess + 1;
                    } else {
                        return;
                    }
                    if (lowValue > highValue) {
                        gameOver = true;
                        alert("Answers conflict. Click Restart.");
                    } else {
                        currentGuess = Math.floor((lowValue + highValue) / 2);
                        guessCount = guessCount + 1;
                    }
                }
            }
            document.getElementById("guess").innerHTML = currentGuess;
            document.getElementById("count").innerHTML = guessCount;
            if (lowValue > highValue) {
                document.getElementById("range").innerHTML = "None";
            } else {
                document.getElementById("range").innerHTML = lowValue + " to " + highValue;
            }
            document.getElementById("lower").disabled = gameOver;
            document.getElementById("higher").disabled = gameOver;
            document.getElementById("correct").disabled = gameOver;
        }
    </script>
</body>
</html>

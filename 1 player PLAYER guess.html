<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <style>
    * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    html {
        min-height: 100%;
        background: linear-gradient(135deg, #0f172a, #1e293b);
    }

    body {
        width: calc(100% - 32px);
        max-width: 380px;
        margin: 40px auto;
        padding: 32px;
        color: #f8fafc;
        text-align: center;
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(12px);
    }

    p {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.6;
    }

    #difficulty {
        width: 100%;
        margin: 12px 0;
        padding: 12px;
        color: #f8fafc;
        background: #334155;
        border: 1px solid #475569;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    #difficulty:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
    }

    input[type="number"] {
        width: 100%;
        margin: 12px 0;
        padding: 16px;
        color: #38bdf8;
        background: #0f172a;
        border: 1px solid #475569;
        border-radius: 12px;
        font-size: 32px;
        font-weight: 700;
        text-align: center;
    }

    input[type="number"]:focus {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
    }

    input[type="button"] {
        display: block;
        width: 100%;
        margin: 10px 0;
        padding: 14px;
        color: #f8fafc;
        background: #334155;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, filter 0.2s;
    }

    #submit {
        background: #3b82f6;
    }

    input[type="button"]:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
    }

    input[type="button"]:active {
        transform: translateY(0);
    }

    input[type="button"]:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 3px;
    }

    input:disabled {
        opacity: 0.4;
        cursor: default;
        transform: none;
        filter: none;
    }

    #hint {
        color: #38bdf8;
        font-size: 20px;
        font-weight: 700;
    }

    #count {
        color: #f8fafc;
        font-weight: 600;
    }

    #history {
        color: #cbd5e1;
        text-align: left;
        line-height: 1.8;
    }
</style>
</head>
<body>
    <p>Guess a whole number from 0 to <span id="maxtext">100</span>.</p>
    <select id="difficulty" onchange="guess(1)">
        <option value="1">Easy (0 to 10)</option>
        <option value="2" selected>Medium (0 to 100)</option>
        <option value="3">Hard (0 to 1000)</option>
    </select>
    <input id="number" type="number" min="0" max="100" step="1">
    <input id="submit" type="button" value="Guess" onclick="guess(0)">
    <input type="button" value="Restart" onclick="guess(1)">
    <p id="hint"></p>
    <p>Guesses: <span id="count">0</span></p>
    <p>History:</p>
    <p id="history"></p>
    <script>
        var maxValue = 100;
        var secretNumber = Math.floor(Math.random() * (maxValue + 1));
        var guessCount = 0;
        var gameOver = false;
        function guess(hl) {
            if (hl == 1) {
                var level = parseInt(document.getElementById("difficulty").value);
                maxValue = 0;
                while (level > 0) {
                    maxValue = maxValue * 10 + 9;
                    level--;
                }
                maxValue = maxValue + 1;
                secretNumber = Math.floor(Math.random() * (maxValue + 1));
                guessCount = 0;
                gameOver = false;
                document.getElementById("maxtext").innerHTML = maxValue;
                document.getElementById("number").max = maxValue;
                document.getElementById("number").value = "";
                document.getElementById("number").disabled = false;
                document.getElementById("submit").disabled = false;
                document.getElementById("hint").innerHTML = "";
                document.getElementById("count").innerHTML = 0;
                document.getElementById("history").innerHTML = "";
                alert("New game! Guess a whole number from 0 to " + maxValue + ".");
                return;
            }
            if (gameOver) {
                return;
            }
            var input = document.getElementById("number").value;
            var number = Number(input);
            if (input == "" || isNaN(number) || number < 0 || number > maxValue || number != Math.floor(number)) {
                alert("Enter a whole number from 0 to " + maxValue + ".");
                return;
            }
            guessCount = guessCount + 1;
            document.getElementById("count").innerHTML = guessCount;
            if (number < secretNumber) {
                document.getElementById("hint").innerHTML = "Too low!";
                document.getElementById("history").innerHTML += number + " - Too low<br>";
            } else if (number > secretNumber) {
                document.getElementById("hint").innerHTML = "Too high!";
                document.getElementById("history").innerHTML += number + " - Too high<br>";
            } else {
                document.getElementById("hint").innerHTML = "Correct!";
                document.getElementById("history").innerHTML += number + " - Correct<br>";
                gameOver = true;
                document.getElementById("number").disabled = true;
                document.getElementById("submit").disabled = true;
                alert("Correct! Your guesses: " + guessCount);
            }
        }
    </script>
</body>
</html>
